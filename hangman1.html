<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #e8ebe4 0%, #d4d9cd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #f5f5f0;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #6b7f5e;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            letter-spacing: 2px;
        }

        /* Homepage Styles */
        .homepage {
            text-align: center;
        }

        .subtitle {
            color: #8a9a7e;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-card {
            background: linear-gradient(135deg, #8a9a7e 0%, #6b7f5e 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .mode-card h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .mode-card p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* Game Styles */
        .game-screen {
            display: none;
        }

        .back-btn {
            background: #d4d9cd;
            color: #6b7f5e;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #8a9a7e;
            color: white;
            transform: translateX(-5px);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px;
            background: #e8ebe4;
            border-radius: 10px;
        }

        .hint, .attempts {
            color: #6b7f5e;
            font-size: 1.1em;
        }

        .hint span, .attempts span {
            font-weight: bold;
            color: #8a9a7e;
        }

        .hangman-canvas {
            text-align: center;
            margin-bottom: 30px;
        }

        canvas {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .word-display {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            letter-spacing: 10px;
            color: #6b7f5e;
            font-weight: bold;
            min-height: 60px;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }

        .key {
            background: #8a9a7e;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .key:hover:not(:disabled) {
            background: #6b7f5e;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .key:disabled {
            background: #d4d9cd;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .new-game-btn {
            width: 100%;
            background: #6b7f5e;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .new-game-btn:hover {
            background: #8a9a7e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .message {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.3em;
            color: #6b7f5e;
            min-height: 30px;
            font-weight: bold;
            animation: fadeIn 0.5s ease;
        }

        .clue {
            color: #8a9a7e;
            animation: slideDown 0.5s ease;
        }

        .wrong-guess {
            color: #8a7e6b;
            animation: shake 0.5s ease;
        }

        .popup {
            position: fixed;
            background: #8a7e6b;
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: popupBounce 0.6s ease;
            pointer-events: none;
        }

        @keyframes popupBounce {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(5deg);
            }
            70% {
                transform: scale(0.9) rotate(-3deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .win {
            color: #6b7f5e;
            animation: bounce 0.5s ease;
        }

        .lose {
            color: #8a7e6b;
            animation: shake 0.5s ease;
        }

        /* Multiplayer Setup */
        .multiplayer-setup {
            display: none;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #6b7f5e;
            font-size: 1.1em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #d4d9cd;
            border-radius: 10px;
            font-size: 1.1em;
            background: white;
            color: #6b7f5e;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #8a9a7e;
        }

        .start-game-btn {
            width: 100%;
            background: #6b7f5e;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .start-game-btn:hover {
            background: #8a9a7e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { 
                opacity: 0;
                transform: translateY(-20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Homepage -->
        <div class="homepage" id="homepage">
            <h1>🎮 HANGMAN</h1>
            <p class="subtitle">Choose your game mode</p>
            
            <div class="mode-selection">
                <div class="mode-card" onclick="selectMode('computer')">
                    <h2>🤖 Play with Computer</h2>
                    <p>Guess words from various categories with helpful hints</p>
                </div>
                
                <div class="mode-card" onclick="selectMode('multiplayer')">
                    <h2>👥 Multiplayer Mode</h2>
                    <p>Challenge a friend! One creates the word, the other guesses</p>
                </div>
            </div>
        </div>

        <!-- Multiplayer Setup -->
        <div class="multiplayer-setup" id="multiplayerSetup">
            <button class="back-btn" onclick="goHome()">← Back</button>
            <h1>Multiplayer Setup</h1>
            
            <div class="input-group">
                <label for="customWord">Enter a word:</label>
                <input type="text" id="customWord" placeholder="Type your word here..." maxlength="15">
            </div>
            
            <div class="input-group">
                <label for="customHint">Enter a hint (optional):</label>
                <input type="text" id="customHint" placeholder="Give a clue...">
            </div>
            
            <button class="start-game-btn" onclick="startMultiplayer()">Start Game</button>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <button class="back-btn" onclick="goHome()">← Back to Menu</button>
            <h1>HANGMAN</h1>
            
            <div class="game-info">
                <div class="hint">Genre: <span id="genre">-</span></div>
                <div class="attempts">Attempts: <span id="attempts">6</span></div>
            </div>

            <div class="hangman-canvas">
                <canvas id="canvas" width="300" height="300"></canvas>
            </div>

            <div class="word-display" id="wordDisplay">_ _ _ _ _</div>
            
            <div class="message" id="message"></div>

            <div class="keyboard" id="keyboard"></div>

            <button class="new-game-btn" onclick="newGame()">New Game</button>
        </div>
    </div>

    <script>
        const words = [
            { word: "PIANO", genre: "Music", clue: "Has black and white keys", hint1: "Musical instrument", hint2: "Starts with 'P'" },
            { word: "DRUMS", genre: "Music", clue: "You hit them with sticks", hint1: "Percussion instrument", hint2: "Makes loud beats" },
            { word: "CHAIR", genre: "Furniture", clue: "You sit on this", hint1: "Found in every room", hint2: "Has four legs" },
            { word: "TABLE", genre: "Furniture", clue: "Eat meals on this", hint1: "Has a flat surface", hint2: "Used for dining" },
            { word: "APPLE", genre: "Fruit", clue: "Keeps the doctor away", hint1: "Can be red or green", hint2: "Starts with 'A'" },
            { word: "GRAPE", genre: "Fruit", clue: "Grows in bunches", hint1: "Used to make wine", hint2: "Small and round" },
            { word: "TIGER", genre: "Animal", clue: "Big cat with stripes", hint1: "King of the jungle relative", hint2: "Orange colored" },
            { word: "ZEBRA", genre: "Animal", clue: "Horse with stripes", hint1: "Black and white", hint2: "Lives in Africa" },
            { word: "BEACH", genre: "Nature", clue: "Sandy shore by the sea", hint1: "Summer vacation spot", hint2: "Has waves" },
            { word: "RIVER", genre: "Nature", clue: "Flows to the ocean", hint1: "Fresh water", hint2: "Fish live here" },
            { word: "SWORD", genre: "Weapon", clue: "Knights used this blade", hint1: "Made of metal", hint2: "Used in medieval times" },
            { word: "ARROW", genre: "Weapon", clue: "Shot from a bow", hint1: "Pointed tip", hint2: "Flies through air" },
            { word: "CLOUD", genre: "Weather", clue: "Fluffy thing in the sky", hint1: "Made of water vapor", hint2: "Can be white or grey" },
            { word: "STORM", genre: "Weather", clue: "Brings heavy rain", hint1: "Has thunder", hint2: "Dark and windy" },
            { word: "DANCE", genre: "Art", clue: "Movement to music", hint1: "Performed on a floor", hint2: "Has rhythm" },
            { word: "BRUSH", genre: "Art", clue: "Used for painting", hint1: "Has bristles", hint2: "Artist's tool" },
            { word: "GLOBE", genre: "Object", clue: "Round map of Earth", hint1: "Found in classrooms", hint2: "Shows countries" },
            { word: "CLOCK", genre: "Object", clue: "Tells the time", hint1: "Has hands", hint2: "Ticks and tocks" },
            { word: "PEARL", genre: "Jewelry", clue: "Found inside an oyster", hint1: "White and shiny", hint2: "Comes from the sea" },
            { word: "RINGS", genre: "Jewelry", clue: "Worn on fingers", hint1: "Often made of gold", hint2: "Symbol of marriage" }
        ];

        const wrongRemarks = [
            "Not quite right...",
            "Oops, wrong letter!",
            "That's not it...",
            "Try again!",
            "Incorrect guess!",
            "Nope, not this one!",
            "Close, but no!",
            "Wrong choice!"
        ];

        let currentMode = "";
        let currentWord = "";
        let currentGenre = "";
        let currentClue = "";
        let currentHint1 = "";
        let currentHint2 = "";
        let guessedLetters = [];
        let attemptsLeft = 6;
        let gameOver = false;
        let firstClueShown = false;
        let secondClueShown = false;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function selectMode(mode) {
            currentMode = mode;
            document.getElementById('homepage').style.display = 'none';
            
            if (mode === 'computer') {
                document.getElementById('gameScreen').style.display = 'block';
                newGame();
            } else {
                document.getElementById('multiplayerSetup').style.display = 'block';
            }
        }

        function startMultiplayer() {
            const word = document.getElementById('customWord').value.toUpperCase().trim();
            const hint = document.getElementById('customHint').value.trim();
            
            if (!word || word.length < 3) {
                alert('Please enter a word with at least 3 letters!');
                return;
            }
            
            if (!/^[A-Z]+$/.test(word)) {
                alert('Please use only letters (A-Z)!');
                return;
            }
            
            currentWord = word;
            currentGenre = "Custom";
            currentClue = hint || "No hint provided";
            currentHint1 = "";
            currentHint2 = "";
            
            document.getElementById('multiplayerSetup').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            // Reset inputs
            document.getElementById('customWord').value = '';
            document.getElementById('customHint').value = '';
            
            startGame();
        }

        function goHome() {
            document.getElementById('homepage').style.display = 'block';
            document.getElementById('multiplayerSetup').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawHangman(attempts) {
            ctx.strokeStyle = '#6b7f5e';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';

            switch(attempts) {
                case 5:
                    ctx.beginPath();
                    ctx.moveTo(50, 280);
                    ctx.lineTo(200, 280);
                    ctx.stroke();
                    break;
                case 4:
                    ctx.beginPath();
                    ctx.moveTo(100, 280);
                    ctx.lineTo(100, 50);
                    ctx.stroke();
                    break;
                case 3:
                    ctx.beginPath();
                    ctx.moveTo(100, 50);
                    ctx.lineTo(200, 50);
                    ctx.stroke();
                    break;
                case 2:
                    ctx.beginPath();
                    ctx.moveTo(200, 50);
                    ctx.lineTo(200, 80);
                    ctx.stroke();
                    break;
                case 1:
                    ctx.beginPath();
                    ctx.arc(200, 110, 30, 0, Math.PI * 2);
                    ctx.stroke();
                    break;
                case 0:
                    ctx.beginPath();
                    ctx.moveTo(200, 140);
                    ctx.lineTo(200, 200);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(200, 160);
                    ctx.lineTo(170, 180);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(200, 160);
                    ctx.lineTo(230, 180);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(200, 200);
                    ctx.lineTo(180, 250);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(200, 200);
                    ctx.lineTo(220, 250);
                    ctx.stroke();
                    break;
            }
        }

        function createKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            
            for (let letter of letters) {
                const key = document.createElement('button');
                key.className = 'key';
                key.textContent = letter;
                key.onclick = () => guessLetter(letter);
                keyboard.appendChild(key);
            }
        }

        function updateDisplay() {
            let display = '';
            for (let letter of currentWord) {
                if (guessedLetters.includes(letter)) {
                    display += letter + ' ';
                } else {
                    display += '_ ';
                }
            }
            document.getElementById('wordDisplay').textContent = display.trim();
        }

        function guessLetter(letter) {
            if (gameOver || guessedLetters.includes(letter)) return;

            guessedLetters.push(letter);
            
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                if (key.textContent === letter) {
                    key.disabled = true;
                }
            });

            if (!currentWord.includes(letter)) {
                attemptsLeft--;
                document.getElementById('attempts').textContent = attemptsLeft;
                drawHangman(attemptsLeft);
                
                createPopup('❌ Wrong!');
                
                const remark = wrongRemarks[Math.floor(Math.random() * wrongRemarks.length)];
                const messageEl = document.getElementById('message');
                messageEl.textContent = remark;
                messageEl.className = 'message wrong-guess';
                
                setTimeout(() => {
                    if (!gameOver) {
                        messageEl.textContent = '';
                        messageEl.className = 'message';
                    }
                }, 1500);

                if (currentMode === 'computer') {
                    if (attemptsLeft === 4 && !firstClueShown && currentHint1) {
                        firstClueShown = true;
                        setTimeout(() => {
                            if (!gameOver) {
                                const messageEl = document.getElementById('message');
                                messageEl.textContent = `💡 Hint 1: ${currentHint1}`;
                                messageEl.className = 'message clue';
                            }
                        }, 1600);
                    }

                    if (attemptsLeft === 3 && !secondClueShown) {
                        secondClueShown = true;
                        setTimeout(() => {
                            if (!gameOver) {
                                const messageEl = document.getElementById('message');
                                messageEl.textContent = `💡 Hint 2: ${currentClue}`;
                                messageEl.className = 'message clue';
                            }
                        }, 1600);
                    }

                    if (attemptsLeft === 2 && currentHint2) {
                        setTimeout(() => {
                            if (!gameOver) {
                                const messageEl = document.getElementById('message');
                                messageEl.textContent = `💡 Hint 3: ${currentHint2}`;
                                messageEl.className = 'message clue';
                            }
                        }, 1600);
                    }
                } else {
                    // Multiplayer mode - show hint at 3 attempts
                    if (attemptsLeft === 3 && currentClue) {
                        setTimeout(() => {
                            if (!gameOver) {
                                const messageEl = document.getElementById('message');
                                messageEl.textContent = `💡 Hint: ${currentClue}`;
                                messageEl.className = 'message clue';
                            }
                        }, 1600);
                    }
                }
            } else {
                createPopup('✓ Correct!');
                
                const messageEl = document.getElementById('message');
                messageEl.textContent = '';
                messageEl.className = 'message';
            }

            updateDisplay();
            checkGameStatus();
        }

        function createPopup(text) {
            const popup = document.createElement('div');
            popup.className = 'popup';
            popup.textContent = text;
            
            const left = Math.random() * 40 + 30;
            const top = Math.random() * 30 + 20;
            popup.style.left = left + '%';
            popup.style.top = top + '%';
            
            if (text.includes('Correct')) {
                popup.style.background = '#6b7f5e';
            }
            
            document.body.appendChild(popup);
            
            setTimeout(() => {
                popup.style.opacity = '0';
                popup.style.transform = 'translateY(-30px) scale(0.8)';
                popup.style.transition = 'all 0.3s ease';
                setTimeout(() => {
                    document.body.removeChild(popup);
                }, 300);
            }, 600);
        }

        function checkGameStatus() {
            const allGuessed = currentWord.split('').every(letter => guessedLetters.includes(letter));
            
            if (allGuessed) {
                document.getElementById('message').textContent = '🎉 You Won!';
                document.getElementById('message').className = 'message win';
                gameOver = true;
            } else if (attemptsLeft === 0) {
                document.getElementById('message').textContent = `Game Over! Word was: ${currentWord}`;
                document.getElementById('message').className = 'message lose';
                gameOver = true;
            }
        }

        function startGame() {
            guessedLetters = [];
            attemptsLeft = 6;
            gameOver = false;
            firstClueShown = false;
            secondClueShown = false;

            document.getElementById('genre').textContent = currentGenre;
            document.getElementById('attempts').textContent = attemptsLeft;
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateDisplay();
            createKeyboard();
        }

        function newGame() {
            if (currentMode === 'computer') {
                const randomWord = words[Math.floor(Math.random() * words.length)];
                currentWord = randomWord.word;
                currentGenre = randomWord.genre;
                currentClue = randomWord.clue;
                currentHint1 = randomWord.hint1;
                currentHint2 = randomWord.hint2;
                startGame();
            } else {
                goHome();
            }
        }
    </script>
</body>
</html>
